<!DOCTYPE html>
<html lang="pt-pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magic Block - Dropdom Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@twemoji/api@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800;900&display=swap');

        img.emoji {
            height: 1em;
            width: 1em;
            margin: 0 .05em 0 .1em;
            vertical-align: -0.1em;
            display: inline-block;
        }

        body {
            background-color: #0f172a;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        .hud-panel {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
        }

        .shop-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .shop-btn:active {
            transform: scale(0.92);
        }

        .shop-btn.active-tool {
            border-color: #facc15 !important;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.6);
            background: rgba(250, 204, 21, 0.15) !important;
            transform: translateY(-2px);
        }

        .item-tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            white-space: normal;
            min-width: 150px;
            max-width: 200px;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 100;
            border: 1px solid #475569;
            text-align: center;
            line-height: 1.3;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            font-weight: 500;
        }

        .group:hover .item-tooltip {
            visibility: visible;
            opacity: 1;
        }

        .tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: #1e293b;
            color: #e2e8f0;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 11px;
            white-space: nowrap;
            transition: all 0.2s ease-out;
            pointer-events: none;
            z-index: 100;
            border: 1px solid #475569;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            font-weight: 600;
        }

        .group:hover .tooltip {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .btn-disabled {
            opacity: 0.5;
            filter: grayscale(100%);
            cursor: not-allowed !important;
            pointer-events: none;
        }

        .popup-menu {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: top center;
            z-index: 70;
        }

        .popup-menu.hidden-menu {
            opacity: 0;
            transform: translate(-50%, -20px) scale(0.95);
            pointer-events: none;
        }

        .shield-active {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6) !important;
        }

        .alert-yellow {
            border-color: #eab308 !important;
        }

        .alert-red {
            animation: pulse-danger-red 1s infinite ease-in-out;
        }



        @keyframes pulse-danger-red {

            0%,
            100% {
                background-color: rgba(239, 68, 68, 0.05);
                box-shadow: inset 0 0 50px rgba(239, 68, 68, 0.2);
            }

            50% {
                background-color: rgba(239, 68, 68, 0.15);
                box-shadow: inset 0 0 100px rgba(239, 68, 68, 0.5);
            }
        }



        @keyframes pulse-freeze {
            0% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
                border-width: 4px;
            }

            100% {
                opacity: 0.5;
            }
        }

        .floating-text {
            position: absolute;
            animation: floatUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            pointer-events: none;
            font-weight: 800;
            font-size: 2rem;
            z-index: 80;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            font-family: 'Rajdhani', sans-serif;
            white-space: nowrap;
            transform: translateX(-50%);
        }

        @keyframes floatUp {
            0% {
                transform: translate(-50%, 0) scale(0.8);
                opacity: 0;
            }

            20% {
                transform: translate(-50%, -20px) scale(1.1);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -80px) scale(1);
                opacity: 0;
            }
        }

        #combo-display {
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.8), 0 0 25px rgba(249, 115, 22, 0.8);
            pointer-events: none;
            font-style: italic;
            transition: left 0.4s ease-out, top 0.4s ease-out, opacity 0.5s ease-in, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            z-index: 90;
            font-size: 2rem;
            font-weight: 900;
            filter: drop-shadow(0 0 5px rgba(249, 115, 22, 0.5));
        }

        .combo-pulse {
            transform: translate(-50%, -50%) scale(1.3) rotate(-5deg);
        }

        .fade-out-slow {
            opacity: 0 !important;
            transition: opacity 0.8s ease-out !important;
        }

        .bounce-up {
            animation: bounce-up 2s infinite;
        }

        @keyframes bounce-up {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        /* Setas interativas */
        .choice-arrow {
            position: absolute;
            z-index: 100;
            color: white;
            font-size: 2.5rem;
            animation: bounce-arrow 1s infinite;
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.8));
            cursor: pointer;
            transition: transform 0.2s;
        }

        .choice-arrow:hover {
            transform: scale(1.2);
            color: #facc15;
        }

        @keyframes bounce-arrow {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #e2e8f0;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #475569;
            border-radius: 2px;
        }
    </style>
</head>

<body
    class="h-screen w-screen flex flex-col items-center justify-center bg-slate-900 gap-4 overflow-hidden select-none">

    <!-- HUD SUPERIOR -->
    <div
        class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] flex gap-6 items-center w-full justify-center px-4 max-w-md">

        <button id="inventory-toggle"
            class="hud-panel p-3 rounded-xl hover:scale-105 transition-all active:scale-95 group border border-blue-500/30 relative shadow-lg shadow-blue-900/20">
            <span class="text-2xl filter drop-shadow-md text-blue-400"><i class="fas fa-briefcase"></i></span>
            <div class="tooltip">Mochila</div>
            <span id="total-inventory-count"
                class="absolute -top-2 -right-2 bg-blue-600 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full font-bold border border-slate-900 hidden">0</span>
        </button>

        <div class="hud-panel p-2 flex flex-col items-center gap-1 w-28 relative transition-all duration-300 mx-2 shadow-lg shadow-purple-900/20"
            id="wizard-container">
            <div class="text-3xl filter drop-shadow-[0_0_10px_rgba(147,51,234,0.6)] transform hover:scale-110 transition-transform cursor-help wizard-emoji"
                title="Feiticeiro">🧙‍♂️</div>
            <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden border border-slate-600 relative">
                <div id="wizard-bar"
                    class="h-full bg-gradient-to-r from-purple-900 via-purple-600 to-purple-400 w-0 transition-all duration-500">
                </div>
            </div>
            <div id="wizard-timer"
                class="absolute -bottom-5 text-[10px] font-bold text-cyan-400 hidden bg-slate-900/80 px-2 rounded">
            </div>
        </div>

        <div id="clock-container"
            class="hud-panel p-2 flex items-center justify-center gap-2 w-auto min-w-[80px] relative transition-all duration-300 mx-2 shadow-lg shadow-cyan-900/20 hidden border-cyan-500 pr-3">
            <i class="fas fa-clock text-cyan-400 animate-pulse"></i>
            <span id="clock-timer" class="font-bold text-cyan-400 font-mono text-sm"></span>
            <button id="stop-clock-btn"
                class="ml-1 w-5 h-5 flex items-center justify-center bg-red-500/20 hover:bg-red-500/40 text-red-400 rounded-full text-[10px] border border-red-500/30 transition-colors">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <button id="volume-toggle"
            class="hud-panel p-3 rounded-xl hover:scale-105 transition-all active:scale-95 group border border-gray-500/30 relative shadow-lg">
            <span class="text-2xl filter drop-shadow-md text-gray-200"><i class="fas fa-volume-up"></i></span>
            <div class="tooltip">Áudio</div>

            <!-- POPUP VOLUME -->
            <div id="volume-popup"
                class="absolute top-[115%] right-0 z-70 popup-menu hidden-menu bg-slate-900/95 p-4 rounded-xl border border-gray-500/30 shadow-2xl backdrop-blur-md w-48 cursor-default">
                <label
                    class="text-[10px] text-gray-400 uppercase font-bold block mb-3 tracking-widest text-center">Volume</label>
                <div class="flex items-center gap-3 text-gray-400">
                    <i class="fas fa-volume-off text-xs"></i>
                    <input type="range" id="volume-slider" min="0" max="100" value="50"
                        class="w-full accent-blue-500 h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    <i class="fas fa-volume-up text-xs"></i>
                </div>
            </div>
        </button>
    </div>



    <!-- PAINEL DE ESCOLHA (STUCK) -->
    <div id="choice-message"
        class="fixed top-1/3 left-1/2 -translate-x-1/2 z-[85] text-center hidden pointer-events-none">
        <h2 class="text-4xl font-black text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.8)] animate-pulse">FAÇA SUA
            ESCOLHA</h2>
    </div>

    <div id="arrow-preview" class="choice-arrow hidden" style="bottom: 120px; left: 50%; transform: translateX(-50%);">
        <i class="fas fa-arrow-down"></i>
    </div>

    <!-- INVENTÁRIO (POPUP) -->
    <div id="inventory-menu"
        class="fixed top-24 left-1/2 z-70 flex gap-4 flex-wrap justify-center max-w-[340px] popup-menu hidden-menu bg-slate-900/95 p-5 rounded-2xl border border-blue-500/30 shadow-2xl backdrop-blur-md -translate-x-1/2">
        <div
            class="absolute -top-3 left-1/2 -translate-x-1/2 bg-blue-600 text-white text-[10px] font-bold px-3 py-0.5 rounded shadow tracking-widest border border-blue-400">
            SUA MOCHILA</div>
        <div id="inventory-items-container" class="flex gap-3 flex-wrap justify-center min-h-[50px]"></div>
    </div>

    <!-- PAINEL DE USO DE ITEM -->
    <div id="item-use-panel"
        class="fixed top-24 left-1/2 -translate-x-1/2 z-[75] bg-slate-900/95 border border-yellow-500/50 p-4 rounded-xl shadow-2xl backdrop-blur-md hidden flex-col items-center gap-2 transform transition-all">
        <p class="text-sm font-bold text-yellow-400" id="item-use-msg">Clique num bloco para usar!</p>
        <button id="cancel-item-btn"
            class="text-xs bg-slate-700 hover:bg-slate-600 text-white px-4 py-1.5 rounded-lg border border-slate-600 transition-colors">Cancelar</button>
    </div>

    <!-- HUD LATERAIS (PONTUAÇÃO) -->
    <div class="fixed top-28 left-4 z-40 flex flex-col gap-3">
        <div
            class="hud-panel px-4 py-2 flex flex-col gap-1 w-44 border-l-4 border-blue-500 shadow-lg shadow-blue-900/10">
            <div class="flex items-center gap-2">
                <div
                    class="w-6 h-6 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-400 font-bold text-[10px] border border-blue-500/50">
                    ⭐</div>
                <span class="text-[10px] uppercase opacity-70 leading-none tracking-wide text-blue-200">Pontuação
                    Atual</span>
            </div>
            <p id="score-display"
                class="text-2xl font-bold text-white leading-none text-right font-mono tracking-tighter">0</p>
        </div>

        <div
            class="hud-panel px-4 py-2 flex flex-col gap-1 w-44 border-l-4 border-orange-500 shadow-lg shadow-orange-900/10">
            <div class="flex items-center gap-2">
                <div
                    class="w-6 h-6 rounded-full bg-orange-500/20 flex items-center justify-center text-orange-400 font-bold text-[10px] border border-orange-500/50">
                    🏆</div>
                <span class="text-[10px] uppercase opacity-70 leading-none tracking-wide text-orange-200">Recorde</span>
            </div>
            <p id="best-display"
                class="text-2xl font-bold text-white leading-none text-right font-mono tracking-tighter">0</p>
        </div>
    </div>

    <!-- TABULEIRO -->
    <div id="game-wrapper"
        class="relative p-2 rounded-2xl bg-[#0f172a] shadow-2xl border border-slate-700/50 mt-28 transition-all duration-300 mx-auto overflow-hidden">
        <div id="combo-display"
            class="absolute z-40 opacity-0 text-orange-400 font-black uppercase text-center select-none pointer-events-none drop-shadow-md">
            COMBO<br>x2
        </div>

        <canvas id="gameCanvas"
            class="rounded-xl bg-[#0a0a0a] block cursor-pointer touch-none shadow-[inset_0_0_30px_rgba(0,0,0,0.8)]"></canvas>

        <div id="toast"
            class="absolute top-16 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-4 py-3 rounded-lg shadow-2xl text-sm font-bold opacity-0 pointer-events-none transition-all duration-300 z-50 whitespace-nowrap border border-red-500/50 flex items-center gap-2 transform translate-y-4">
            <i class="fas fa-exclamation-circle text-red-500"></i> <span id="toast-msg">Ação Inválida</span>
        </div>

        <div id="freeze-overlay"
            class="absolute inset-0 bg-cyan-500/10 pointer-events-none opacity-0 transition-opacity duration-500 z-10 border-4 border-cyan-400/30 rounded-xl">
        </div>

        <div id="danger-overlay"
            class="absolute inset-0 pointer-events-none transition-opacity duration-300 z-20 rounded-xl">
        </div>

        <div id="overlay"
            class="absolute inset-0 bg-black/95 flex flex-col items-center justify-center z-50 hidden opacity-0 transition-opacity duration-500 rounded-xl backdrop-blur-sm">
            <h1
                class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-slate-400 mb-2 tracking-tighter filter drop-shadow-lg">
                GAME OVER</h1>
            <div class="w-full max-w-[200px] h-1 bg-slate-700 rounded-full mb-8"></div>
            <div class="grid grid-cols-2 gap-8 text-center mb-10 w-full px-12">
                <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                    <p class="text-xs uppercase text-blue-400 font-bold mb-1">Pontuação</p>
                    <p id="final-score" class="text-3xl font-mono font-bold text-white">0</p>
                </div>
                <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                    <p class="text-xs uppercase text-orange-400 font-bold mb-1">Recorde</p>
                    <p id="final-best" class="text-3xl font-mono font-bold text-white">0</p>
                </div>
            </div>

            <button id="restart-btn"
                class="px-8 py-4 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold rounded-xl transition-all hover:scale-105 active:scale-95 shadow-lg shadow-blue-900/50 uppercase tracking-widest text-sm flex items-center gap-2">
                <i class="fas fa-redo"></i> Jogar Novamente
            </button>
        </div>
    </div>

    <script>
        // Variáveis DOM
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameWrapperEl = document.getElementById('game-wrapper');
        const scoreEl = document.getElementById('score-display');
        const bestEl = document.getElementById('best-display');
        const finalScoreEl = document.getElementById('final-score');
        const finalBestEl = document.getElementById('final-best');
        const overlay = document.getElementById('overlay');
        const dangerOverlay = document.getElementById('danger-overlay');
        const restartBtn = document.getElementById('restart-btn');
        const toastEl = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');
        const comboDisplayEl = document.getElementById('combo-display');
        const volumeToggleBtn = document.getElementById('volume-toggle');
        const volumePopup = document.getElementById('volume-popup');
        const volumeSlider = document.getElementById('volume-slider');
        const wizardBarEl = document.getElementById('wizard-bar');
        // Board texture for Nano Banana style
        const boardTexture = new Image();
        boardTexture.src = 'Tabuleiro.png';
        const wizardContainerEl = document.getElementById('wizard-container');
        const wizardTimerEl = document.getElementById('wizard-timer');
        const clockContainerEl = document.getElementById('clock-container');
        const clockTimerEl = document.getElementById('clock-timer');

        // Emoji Images for Canvas
        const emojiImages = {};
        const EMOJI_LIST = { chest: '🎁', ice: '🧊' };

        function loadEmojiImages() {
            for (const [key, emoji] of Object.entries(EMOJI_LIST)) {
                const img = new Image();
                // Get unicode sequence for the emoji
                const codePoints = [];
                for (const char of emoji) {
                    codePoints.push(char.codePointAt(0).toString(16));
                }
                const unicode = codePoints.join('-');
                img.src = `https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/72x72/${unicode}.png`;
                emojiImages[key] = img;
            }
        }
        loadEmojiImages();

        // Variáveis DOM Inventário
        const inventoryToggleBtn = document.getElementById('inventory-toggle');
        const inventoryMenuEl = document.getElementById('inventory-menu');
        const totalInventoryCountEl = document.getElementById('total-inventory-count');
        const inventoryContainer = document.getElementById('inventory-items-container');
        const itemUsePanel = document.getElementById('item-use-panel');
        const cancelItemBtn = document.getElementById('cancel-item-btn');

        // Elementos de Decisão (Stuck State)
        const choiceMessage = document.getElementById('choice-message');
        const arrowPreview = document.getElementById('arrow-preview');

        // Configurações
        const COLORS = ['#ef4444', '#22c55e', '#3b82f6', '#a855f7'];
        const COLS = 8, ROWS = 10;
        let CELL_SIZE = 40;

        // Estado
        let blocks = [], nextRowBlocks = [], particles = [];
        let score = 0, bestScore = parseInt(localStorage.getItem('dropdom_best')) || 0;
        const WIZARD_MAX = 100, WIZARD_STEP = 20;

        let activeTool = null;
        let inventory = { hammer: 0, tractor: 0, lightning: 0, fire: 0, superfire: 0, dragon: 0, glove: 0, marreta: 0, relogio: 0 };

        let comboHideTimer = null;
        let wizardCharge = 0, wizardShieldActive = false, wizardShieldTime = 0, shieldInterval = null;
        let clockActive = false, clockTime = 0, clockInterval = null;
        let gameActive = false, isProcessingTurn = false, isRefilling = false, comboMultiplier = 0;
        let selectedBlock = null, dragStartX = 0, blockStartX = 0, originalC = 0;
        let isGameOverSequence = false;
        let turnCounter = 0;
        let animationFrameId = null;
        let isStuckMode = false;
        let turnLinesCleared = 0;
        let waitingForForceUp = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let savedVol = localStorage.getItem('dropdom_volume');
        let masterVolume = savedVol !== null ? parseFloat(savedVol) : 0.5;
        if (volumeSlider) volumeSlider.value = masterVolume * 100;

        // --- MÚSICA DE FUNDO E EFEITOS ---
        const bgMusic = new Audio('musica.mp3');
        bgMusic.loop = true;
        bgMusic.volume = masterVolume * 0.6;
        let musicaIniciada = false;
        const somDanger = new Audio('Danger.mp3');
        somDanger.loop = true;
        const somCoin = new Audio('Coin.mp3');
        const somBau = new Audio('Bau.mp3');
        const somGameOver = new Audio('Game Over.mp3');

        const iniciarMusica = () => {
            if (!musicaIniciada) {
                bgMusic.play().catch(() => console.log("Aguardando interação para áudio"));
                musicaIniciada = true;
                window.removeEventListener('click', iniciarMusica);
                window.removeEventListener('touchstart', iniciarMusica);
            }
        };
        window.addEventListener('click', iniciarMusica);
        window.addEventListener('touchstart', iniciarMusica);

        // --- SISTEMA DE ÁUDIO E FUNÇÕES AUXILIARES ---
        function playTone(freq, type, duration, vol = 1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (masterVolume <= 0.01) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol * masterVolume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playMoveSound() { /* Removido a pedido */ }
        function playFreezeSound() { playTone(600, 'triangle', 0.1, 0.3); playTone(1200, 'sine', 0.3, 0.2); }
        function playErrorSound() { playTone(150, 'sawtooth', 0.15, 0.4); }
        function playExplosionSound() {
            somCoin.currentTime = 0;
            somCoin.volume = masterVolume;
            somCoin.play().catch(() => { });
        }

        function showToast(msg, type = 'info') {
            toastMsg.innerHTML = type === 'error' ? `<i class="fas fa-exclamation-circle text-red-500 mr-1"></i>${msg}` : msg;
            twemoji.parse(toastMsg);
            toastEl.style.opacity = '1';
            setTimeout(() => toastEl.style.opacity = '0', 2000);
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({ x, y, vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12, life: 1.2, color });
            }
        }

        function createFloatingText(x, y, content, color) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.style.left = `${x}px`; el.style.top = `${y}px`; el.style.color = color;
            el.innerHTML = content;
            twemoji.parse(el);
            gameWrapperEl.appendChild(el);
            setTimeout(() => el.remove(), 1200);
        }

        function updateInventoryUI() {
            inventoryContainer.innerHTML = '';
            let total = 0;
            const names = { hammer: 'Martelo', tractor: 'Trator', lightning: 'Raio', fire: 'Fogo', superfire: 'Super Fogo', dragon: 'Dragão', glove: 'Luva', marreta: 'Espada', relogio: 'Relógio' };
            const icons = { hammer: '🔨', tractor: '🚜', lightning: '⚡', fire: '🔥', superfire: '🔥🔥', dragon: '🐉', glove: '💪', marreta: '🗡️', relogio: '⏰' };

            for (let [key, count] of Object.entries(inventory)) {
                if (key === 'shield') continue;
                total += count;
                const btn = document.createElement('button');
                btn.className = `shop-btn flex flex-col items-center p-2 rounded-xl border border-slate-700 bg-slate-800 ${count > 0 ? 'hover:bg-slate-700 cursor-pointer' : 'btn-disabled'} ${activeTool === key ? 'active-tool' : ''} group w-[65px]`;
                btn.onclick = (e) => { e.stopPropagation(); if (count > 0) selectTool(key); };
                btn.innerHTML = `<span class="text-2xl drop-shadow-md mb-1">${icons[key]}</span>
                                 <span class="text-[10px] font-bold bg-slate-900 border border-slate-600 px-2 py-0.5 rounded-md">${count}</span>
                                 <div class="item-tooltip">${names[key]}</div>`;
                twemoji.parse(btn);
                inventoryContainer.appendChild(btn);
            }

            if (total > 0) {
                totalInventoryCountEl.textContent = total;
                totalInventoryCountEl.classList.remove('hidden');
            } else {
                totalInventoryCountEl.classList.add('hidden');
            }
        }

        function handleClockEnd() {
            clockActive = false;
            clearInterval(clockInterval);
            clockContainerEl.classList.add('hidden');
            showToast("O tempo voltou a correr!", "info");

            if (isProcessingTurn || isRefilling) return;

            const activeRowIndices = new Set(blocks.map(b => b.targetR));
            const maxRowIndex = blocks.length > 0 ? Math.min(...activeRowIndices) : ROWS;

            if (maxRowIndex >= ROWS - 3) {
                const rowsToAdd = maxRowIndex - (ROWS - 5);
                if (rowsToAdd > 0) {
                    isRefilling = true;
                    isProcessingTurn = true;
                    pushMultipleRows(rowsToAdd, () => {
                        isRefilling = false;
                        isProcessingTurn = false;
                        setTimeout(() => { comboDisplayEl.style.opacity = "0"; }, 1500);
                        checkStuckState();
                    });
                }
            } else {
                checkStuckState();
            }
        }

        function selectTool(key) {
            if (inventory[key] <= 0) return;

            if (key === 'relogio') {
                inventoryMenuEl.classList.add('hidden-menu');
                if (!clockActive) {
                    clockActive = true;
                    clockTime = 30;
                    inventory['relogio']--;
                    saveData();
                    updateInventoryUI();

                    if (clockInterval) clearInterval(clockInterval);

                    clockContainerEl.classList.remove('hidden');
                    clockTimerEl.textContent = `${clockTime}s`;

                    clockInterval = setInterval(() => {
                        clockTime--;
                        if (clockTime > 0) {
                            clockTimerEl.textContent = `${clockTime}s`;
                        } else {
                            handleClockEnd();
                        }
                    }, 1000);

                    showToast("Tempo Parado por 30s!");
                } else {
                    showToast("Relógio já está ativo!", "error");
                    playErrorSound();
                }
                return;
            }

            if (key === 'dragon') {
                inventoryMenuEl.classList.add('hidden-menu');
                const frozen = blocks.filter(b => b.isFrozen);
                if (frozen.length > 0) {
                    blocks.forEach(b => { b.isFrozen = false; b.iceHp = 0; });
                    inventory['dragon']--;
                    saveData();
                    updateInventoryUI();
                    playExplosionSound();
                    createExplosion(canvas.width / 2, canvas.height / 2, '#fff');
                    showToast("Dragão: Gelo derretido!");
                    isProcessingTurn = true;
                    setTimeout(() => { checkGravity(() => { isProcessingTurn = false; checkStuckState(); }, true); }, 100);
                } else {
                    showToast("Nenhum gelo no campo!", "error");
                    playErrorSound();
                }
                return;
            }

            activeTool = key;
            updateInventoryUI();
            inventoryMenuEl.classList.add('hidden-menu');
            itemUsePanel.classList.remove('hidden');

            const names = { hammer: 'Martelo', tractor: 'Trator', lightning: 'Raio', fire: 'Fogo', superfire: 'Super Fogo', dragon: 'Dragão', marreta: 'Espada', relogio: 'Relógio' };
            const msg = document.getElementById('item-use-msg');
            msg.textContent = `Aponte o ${names[key]}!`;
            gameWrapperEl.style.cursor = 'crosshair';
        }

        function cancelTool() {
            activeTool = null;
            itemUsePanel.classList.add('hidden');
            gameWrapperEl.style.cursor = 'pointer';
            updateInventoryUI();
        }

        function handleTool(r, c) {
            if (!activeTool || inventory[activeTool] <= 0 || isProcessingTurn || isRefilling) return;
            let used = false;
            let targetX = c * CELL_SIZE + CELL_SIZE / 2;
            let targetY = r * CELL_SIZE + CELL_SIZE / 2;

            if (activeTool === 'hammer') {
                const b = blocks.find(b => b.targetR === r && c >= b.c && c < b.c + b.w);
                if (b && b.w > 1) {
                    b.w--; used = true;
                    targetX = b.x + (b.w * CELL_SIZE / 2); targetY = b.y + CELL_SIZE / 2;
                }
            } else if (activeTool === 'marreta') {
                const b = blocks.find(b => b.targetR === r && c >= b.c && c < b.c + b.w);
                if (b && b.w > 1) {
                    let w1 = Math.floor(b.w / 2);
                    let w2 = Math.ceil(b.w / 2);
                    b.w = w1;
                    const newB = new Block(b.c + w1, b.r, w2, false);
                    newB.targetR = b.targetR;
                    newB.y = b.y;
                    newB.isFrozen = b.isFrozen;
                    newB.iceHp = b.iceHp;
                    blocks.push(newB);
                    used = true;
                    targetX = b.x + (b.w * CELL_SIZE / 2); targetY = b.y + CELL_SIZE / 2;
                }
            } else if (activeTool === 'lightning') {
                const b = blocks.find(b => b.targetR === r && c >= b.c && c < b.c + b.w);
                if (b && !b.isFrozen) {
                    const surround = blocks.filter(item => {
                        if (item.isFrozen) return false;
                        if (item === b) return true;
                        if (item.targetR === b.targetR && (item.c + item.w === b.c || item.c === b.c + b.w)) return true;
                        if (Math.abs(item.targetR - b.targetR) === 1 && item.c < b.c + b.w && item.c + item.w > b.c) return true;
                        return false;
                    });
                    blocks = blocks.filter(item => !surround.includes(item));
                    used = true;
                    targetX = b.x + (b.w * CELL_SIZE / 2); targetY = b.y + CELL_SIZE / 2;
                }
            } else if (activeTool === 'tractor') {
                const targets = blocks.filter(b => b.targetR === r && !b.isFrozen);
                if (targets.length > 0) {
                    blocks = blocks.filter(item => {
                        if (item.targetR === r && !item.isFrozen) return false;
                        return true;
                    });
                    used = true;
                    targetX = canvas.width / 2; targetY = r * CELL_SIZE + CELL_SIZE / 2;
                }
            } else if (activeTool === 'fire') {
                const b = blocks.find(b => b.targetR === r && c >= b.c && c < b.c + b.w);
                if (b && b.isFrozen) {
                    b.iceHp--; if (b.iceHp <= 0) { b.isFrozen = false; b.iceHp = 0; }
                    used = true;
                    targetX = b.x + (b.w * CELL_SIZE / 2); targetY = b.y + CELL_SIZE / 2;
                }
            } else if (activeTool === 'superfire') {
                const b = blocks.find(b => b.targetR === r && c >= b.c && c < b.c + b.w);
                if (b && b.isFrozen) {
                    const surround = blocks.filter(item => {
                        if (!item.isFrozen) return false;
                        if (item === b) return true;
                        if (item.targetR === b.targetR && (item.c + item.w === b.c || item.c === b.c + b.w)) return true;
                        if (Math.abs(item.targetR - b.targetR) === 1 && item.c < b.c + b.w && item.c + item.w > b.c) return true;
                        return false;
                    });
                    surround.forEach(item => {
                        item.iceHp--; if (item.iceHp <= 0) { item.isFrozen = false; item.iceHp = 0; }
                    });
                    used = true;
                    targetX = b.x + (b.w * CELL_SIZE / 2); targetY = b.y + CELL_SIZE / 2;
                }
            }

            if (used) {
                inventory[activeTool]--;
                saveData();
                playExplosionSound();
                createExplosion(targetX, targetY, '#fff');
                cancelTool();
                isProcessingTurn = true;
                setTimeout(() => { checkGravity(() => { isProcessingTurn = false; checkStuckState(); }, true); }, 100);
            } else {
                showToast("Alvo Inválido!", "error");
                playErrorSound();
            }
        }

        function giveChestReward(x, y) {
            const rand = Math.random();
            if (rand < 0.7) {
                createFloatingText(x, y, `Vazio...`, "#9ca3af");
            } else {
                somBau.currentTime = 0; somBau.volume = masterVolume; somBau.play().catch(() => { });
                const items = ['hammer', 'tractor', 'lightning', 'fire', 'superfire', 'shield', 'dragon', 'glove', 'marreta', 'relogio'];

                    showToast(`+1 ${itemIcons[itemKey]} Guardado!`, 'info');
                    createFloatingText(x, y, `+1 ${itemIcons[itemKey]}`, "#facc15");
                    updateInventoryUI();
                    saveData();
                }
            }
            updateUI();
        }

        function applyRandomItem(x, y, forceItem = null) {
            const items = ['hammer', 'tractor', 'lightning', 'fire', 'superfire', 'shield', 'dragon', 'marreta', 'relogio'];
            let itemKey = forceItem || items[Math.floor(Math.random() * items.length)];
            const itemIcons = { hammer: '🔨', tractor: '🚜', lightning: '⚡', fire: '🔥', superfire: '🔥🔥', shield: '🛡️', dragon: '🐉', marreta: '🗡️', relogio: '⏰' };

            let used = false;
            let targetX = x, targetY = y;

            if (itemKey === 'dragon') {
                const frozen = blocks.filter(b => b.isFrozen);
                if (frozen.length > 0) {
                    blocks.forEach(b => { b.isFrozen = false; b.iceHp = 0; });
                    used = true;
                    showToast("Dragão: Gelo derretido!");
                }
            } else if (itemKey === 'shield') {
                if (!wizardShieldActive) {
                    wizardShieldActive = true; wizardShieldTime = 30;
                    updateWizardUI();
                    if (shieldInterval) clearInterval(shieldInterval);
                    shieldInterval = setInterval(() => {
                        wizardShieldTime--;
                        wizardTimerEl.textContent = `${wizardShieldTime}s`;
                        if (wizardShieldTime <= 0) {
                            wizardShieldActive = false; clearInterval(shieldInterval); updateWizardUI();
                        }
                    }, 1000);
                    used = true;
                    showToast("Escudo Ativado!");
                }
            } else if (itemKey === 'relogio') {
                if (!clockActive) {
                    clockActive = true; clockTime = 30;
                    if (clockInterval) clearInterval(clockInterval);
                    clockContainerEl.classList.remove('hidden');
                    clockTimerEl.textContent = `${clockTime}s`;
                    clockInterval = setInterval(() => {
                        clockTime--;
                        if (clockTime > 0) { clockTimerEl.textContent = `${clockTime}s`; }
                        else { handleClockEnd(); }
                    }, 1000);
                    used = true;
                    showToast("Tempo Parado por 30s!");
                }
            } else if (itemKey === 'hammer') {
                const targets = blocks.filter(b => b.w > 1 && b.targetR < ROWS);
                if (targets.length > 0) {
                    const b = targets[Math.floor(Math.random() * targets.length)];
                    b.w--; used = true;
                    targetX = b.x + (b.w * CELL_SIZE / 2); targetY = b.y + CELL_SIZE / 2;
                }
            } else if (itemKey === 'marreta') {
                const targets = blocks.filter(b => b.w > 1 && b.targetR < ROWS);
                if (targets.length > 0) {
                    const b = targets[Math.floor(Math.random() * targets.length)];
                    let w1 = Math.floor(b.w / 2);
                    let w2 = Math.ceil(b.w / 2);
                    b.w = w1;
                    const newB = new Block(b.c + w1, b.r, w2, false);
                    newB.targetR = b.targetR;
                    newB.y = b.y;
                    newB.isFrozen = b.isFrozen;
                    newB.iceHp = b.iceHp;
                    blocks.push(newB);
                    used = true;
                    targetX = b.x + (b.w * CELL_SIZE / 2); targetY = b.y + CELL_SIZE / 2;
                }
            } else if (itemKey === 'lightning') {
                const targets = blocks.filter(b => !b.isFrozen && b.targetR < ROWS);
                if (targets.length > 0) {
                    const b = targets[Math.floor(Math.random() * targets.length)];
                    const surround = blocks.filter(item => {
                        if (item.isFrozen) return false;
                        if (item === b) return true;
                        if (item.targetR === b.targetR && (item.c + item.w === b.c || item.c === b.c + b.w)) return true;
                        if (Math.abs(item.targetR - b.targetR) === 1 && item.c < b.c + b.w && item.c + item.w > b.c) return true;
                        return false;
                    });
                    blocks = blocks.filter(item => !surround.includes(item));
                    used = true;
                    targetX = b.x + (b.w * CELL_SIZE / 2); targetY = b.y + CELL_SIZE / 2;
                }
            } else if (itemKey === 'tractor') {
                const targets = blocks.filter(b => b.targetR < ROWS);
                if (targets.length > 0) {
                    const targetsWithNonFrozen = targets.filter(b => !b.isFrozen);
                    if (targetsWithNonFrozen.length > 0) {
                        const randR = targetsWithNonFrozen[Math.floor(Math.random() * targetsWithNonFrozen.length)].targetR;
                        blocks = blocks.filter(item => {
                            if (item.targetR === randR && !item.isFrozen) return false;
                            return true;
                        });
                        used = true;
                        targetX = canvas.width / 2; targetY = randR * CELL_SIZE + CELL_SIZE / 2;
                    }
                }
            } else if (itemKey === 'fire') {
                const targets = blocks.filter(b => b.isFrozen);
                if (targets.length > 0) {
                    const b = targets[Math.floor(Math.random() * targets.length)];
                    b.iceHp--; if (b.iceHp <= 0) { b.isFrozen = false; b.iceHp = 0; }
                    used = true;
                    targetX = b.x + (b.w * CELL_SIZE / 2); targetY = b.y + CELL_SIZE / 2;
                }
            } else if (itemKey === 'superfire') {
                const targets = blocks.filter(b => b.isFrozen);
                if (targets.length > 0) {
                    const b = targets[Math.floor(Math.random() * targets.length)];
                    const surround = blocks.filter(item => {
                        if (!item.isFrozen) return false;
                        if (item === b) return true;
                        if (item.targetR === b.targetR && (item.c + item.w === b.c || item.c === b.c + b.w)) return true;
                        if (Math.abs(item.targetR - b.targetR) === 1 && item.c < b.c + b.w && item.c + item.w > b.c) return true;
                        return false;
                    });
                    surround.forEach(item => {
                        item.iceHp--; if (item.iceHp <= 0) { item.isFrozen = false; item.iceHp = 0; }
                    });
                    used = true;
                    targetX = b.x + (b.w * CELL_SIZE / 2); targetY = b.y + CELL_SIZE / 2;
                }
            }

            if (!used && !forceItem) {
                // Se o item falhou (não tinha alvo), converte para o raio (que age livremente)
                applyRandomItem(x, y, 'lightning');
                return;
            }

            createFloatingText(x, y, `${itemIcons[itemKey]}`, "#3b82f6");

            if (['hammer', 'tractor', 'lightning', 'fire', 'superfire', 'marreta'].includes(itemKey) && used) {
                playExplosionSound();
                createExplosion(targetX, targetY, '#fff');
            }
        }

        function resizeCanvas() {
            const h = window.innerHeight - 180;
            const w = window.innerWidth - 40;
            CELL_SIZE = Math.min(Math.floor(h / (ROWS + 1.2)), Math.floor(w / COLS), 70);
            canvas.width = CELL_SIZE * COLS;
            canvas.height = ROWS * CELL_SIZE + CELL_SIZE + 5;
        }



        window.addEventListener('resize', resizeCanvas);

        class Block {
            constructor(c, r, w, isPreview = false) {
                this.c = c; this.r = r; this.w = w; this.targetR = r;
                this.x = c * CELL_SIZE; this.y = r * CELL_SIZE;
                this.color = COLORS[Math.floor(Math.random() * COLORS.length)]; this.isPreview = isPreview;
                this.isFrozen = false; this.iceHp = 0; this.hasChest = false;
                this.isGray = false;
            }
            draw(offsetY = 0) {
                const targetY = this.targetR * CELL_SIZE + offsetY;
                const dy = targetY - this.y;
                if (Math.abs(dy) < 0.2) this.y = targetY; else this.y += dy * 0.15;
                if (selectedBlock !== this && activeTool === null) {
                    const dx = this.c * CELL_SIZE - this.x;
                    if (Math.abs(dx) < 0.2) this.x = this.c * CELL_SIZE; else this.x += dx * 0.3;
                }
                const gap = 3, r = 8;
                // Prévia mais transparente (0.25)
                const alpha = this.isPreview ? 0.25 : 1;

                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.isGray ? '#475569' : this.color;
                ctx.shadowColor = this.isGray ? 'transparent' : this.color;
                ctx.shadowBlur = this.isGray ? 0 : 8;
                this.roundRect(this.x + gap, this.y + gap, (this.w * CELL_SIZE) - gap * 2, CELL_SIZE - gap * 2, r);
                ctx.fill();
                ctx.globalAlpha = 1;

                if (!this.isGray) {
                    ctx.fillStyle = `rgba(255,255,255,${alpha * 0.2})`;
                    ctx.fillRect(this.x + gap + 4, this.y + gap + 4, (this.w * CELL_SIZE) - gap * 2 - 8, (CELL_SIZE - gap * 2) / 2 - 2);
                }

                // Gelo e Baú só aparecem se não for prévia
                if (this.hasChest && !this.isGray && !this.isPreview) {
                    if (emojiImages.chest && emojiImages.chest.complete) {
                        const size = 24;
                        ctx.drawImage(emojiImages.chest, this.x + (this.w * CELL_SIZE) / 2 - size / 2, this.y + CELL_SIZE / 2 - size / 2, size, size);
                    } else {
                        ctx.shadowBlur = 10; ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.fillStyle = 'white'; ctx.font = '20px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🎁', this.x + (this.w * CELL_SIZE) / 2, this.y + CELL_SIZE / 2);
                    }
                }
                if (this.isFrozen && !this.isGray && !this.isPreview) {
                    ctx.shadowBlur = 15; ctx.shadowColor = "#22d3ee"; ctx.fillStyle = 'rgba(165, 243, 252, 0.4)';
                    this.roundRect(this.x + gap, this.y + gap, (this.w * CELL_SIZE) - gap * 2, CELL_SIZE - gap * 2, r); ctx.fill();
                    ctx.shadowBlur = 0;

                    if (emojiImages.ice && emojiImages.ice.complete) {
                        const size = 20;
                        const totalW = size + 15; // Image + text width estimate
                        const startX = this.x + (this.w * CELL_SIZE) / 2 - totalW / 2;
                        ctx.drawImage(emojiImages.ice, startX, this.y + CELL_SIZE / 2 - size / 2, size, size);
                        ctx.fillStyle = 'white'; ctx.font = `bold 18px Rajdhani`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                        ctx.fillText(this.iceHp, startX + size + 2, this.y + CELL_SIZE / 2);
                    } else {
                        ctx.fillStyle = 'white'; ctx.font = `bold 18px Rajdhani`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText(`🧊${this.iceHp}`, this.x + (this.w * CELL_SIZE) / 2, this.y + CELL_SIZE / 2);
                    }
                }
            }
            roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
        }

        function initGame() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            blocks = []; particles = []; score = 0; comboMultiplier = 0; wizardCharge = 0;
            isGameOverSequence = false; wizardShieldActive = false; turnCounter = 0;
            isProcessingTurn = false; isRefilling = false; selectedBlock = null;
            hasGameStarted = true; isStuckMode = false;

            if (shieldInterval) clearInterval(shieldInterval);
            bestScore = parseInt(localStorage.getItem('dropdom_best')) || 0;
            inventory = { hammer: 0, tractor: 0, lightning: 0, fire: 0, superfire: 0, dragon: 0, glove: 0, marreta: 0, relogio: 0 };
            if (clockInterval) clearInterval(clockInterval);
            clockActive = false; clockTime = 0;
            if (clockContainerEl) clockContainerEl.classList.add('hidden');

            updateUI(); updateWizardUI(); updateInventoryUI();
            generateNextPreview();
            gameActive = true;
            overlay.classList.add('hidden'); overlay.style.opacity = '0';
            comboDisplayEl.style.opacity = '0';
            toggleStuckUI(false);

            loop();
            isRefilling = true;
            pushMultipleRows(6, () => { isRefilling = false; checkStuckState(); });
            twemoji.parse(document.body);
        }

        function generateNextPreview() {
            nextRowBlocks = [];
            let isGap = new Array(COLS).fill(false);

            // Determinar tamanhos dos dois espaços (gaps)
            let s1 = Math.floor(Math.random() * 2) + 1; // 1 ou 2
            let s2 = (s1 > 1) ? 1 : (Math.floor(Math.random() * 2) + 1); // Se s1 > 1, s2 deve ser 1. Senão, 1 ou 2.

            // Posicionar o primeiro gap
            let p1 = Math.floor(Math.random() * (COLS - s1 + 1));
            for (let i = 0; i < s1; i++) isGap[p1 + i] = true;

            // Encontrar posições válidas para o segundo gap (sem sobreposição)
            let validP2 = [];
            for (let i = 0; i <= COLS - s2; i++) {
                let overlap = false;
                for (let j = 0; j < s2; j++) {
                    if (isGap[i + j]) { overlap = true; break; }
                }
                if (!overlap) validP2.push(i);
            }

            if (validP2.length > 0) {
                let p2 = validP2[Math.floor(Math.random() * validP2.length)];
                for (let i = 0; i < s2; i++) isGap[p2 + i] = true;
            }

            // Gerar blocos nos espaços restantes
            let c = 0;
            while (c < COLS) {
                if (isGap[c]) { c++; continue; }

                let maxPossibleW = 0;
                while (c + maxPossibleW < COLS && !isGap[c + maxPossibleW] && maxPossibleW < 4) {
                    maxPossibleW++;
                }

                if (maxPossibleW > 0) {
                    let w = Math.floor(Math.random() * maxPossibleW) + 1;
                    const b = new Block(c, ROWS, w, true);
                    b.y = canvas.height + CELL_SIZE * 2;
                    nextRowBlocks.push(b);
                    c += w;
                } else {
                    c++;
                }
            }

            // Lógica de Probabilidade (A partir do Turno 1)
            if (turnCounter > 1) { // Aumentado para turnCounter > 1 para dar uma folga inicial
                const rand = Math.random() * 100;
                if (rand < 40) {
                    // 40% Apenas Gelo
                    if (nextRowBlocks.length > 0) {
                        const b = nextRowBlocks[Math.floor(Math.random() * nextRowBlocks.length)];
                        b.isFrozen = true; b.iceHp = 1;
                    }
                } else if (rand < 50) {
                    // 10% Apenas Baú
                    if (nextRowBlocks.length > 0) {
                        const b = nextRowBlocks[Math.floor(Math.random() * nextRowBlocks.length)];
                        b.hasChest = true;
                    }
                } else if (rand < 60) {
                    // 10% Gelo + Baú
                    if (nextRowBlocks.length > 0) {
                        const b1 = nextRowBlocks[Math.floor(Math.random() * nextRowBlocks.length)];
                        b1.isFrozen = true; b1.iceHp = 1;
                        const b2 = nextRowBlocks[Math.floor(Math.random() * nextRowBlocks.length)];
                        b2.hasChest = true;
                    }
                }
            }
        }

        function pushNextRow(callback) {
            turnCounter++;
            blocks.forEach(b => b.targetR--);
            nextRowBlocks.forEach(b => {
                b.r = ROWS; b.targetR = ROWS - 1; b.y = (ROWS + 1) * CELL_SIZE;
                b.isPreview = false; blocks.push(b);
            });
            generateNextPreview();
            setTimeout(() => checkGravity(callback), 80);
        }

        function triggerPushChain(onComplete, isFirstPush = true) {
            let linesBeforePush = turnLinesCleared;

            if (!isFirstPush && blocks.some(b => b.targetR <= 1)) {
                if (onComplete) onComplete();
                return;
            }

            pushNextRow(() => {
                let linesFromPush = turnLinesCleared - linesBeforePush;
                if (linesFromPush > 0) {
                    setTimeout(() => triggerPushChain(onComplete, false), 150);
                } else {
                    if (onComplete) onComplete();
                }
            });
        }

        function executeForceUp() {
            if (isProcessingTurn || isRefilling) return;
            toggleStuckUI(false);
            isProcessingTurn = true;
            turnLinesCleared = 0;
            waitingForForceUp = true;
            triggerPushChain(() => {
                updateWizardCharge(WIZARD_STEP);
                isProcessingTurn = false;
                waitingForForceUp = false;
                checkAutoRefill();
            });
        }

        function checkGravity(callback, isFinalCheck = false) {
            let moved = false;
            blocks.sort((a, b) => a.targetR - b.targetR).forEach(b => {
                if (b.targetR < ROWS - 1 && !blocks.some(o => o.targetR === b.targetR + 1 && !(o.c >= b.c + b.w || o.c + o.w <= b.c))) {
                    b.targetR++; moved = true;
                }
            });

            if (moved) {
                setTimeout(() => checkGravity(callback, isFinalCheck), 100);
            } else {
                let corrected = false;
                for (let r = 0; r < ROWS; r++) {
                    let occupied = new Array(COLS).fill(null);
                    const rBlocks = blocks.filter(b => b.targetR === r);
                    rBlocks.forEach(b => {
                        let hasOverlap = false;
                        for (let i = 0; i < b.w; i++) {
                            const pos = b.c + i;
                            if (pos >= COLS || occupied[pos] !== null) { hasOverlap = true; break; }
                        }
                        if (hasOverlap) {
                            if (b.targetR < ROWS - 1) { b.targetR++; corrected = true; }
                            else { blocks = blocks.filter(item => item !== b); corrected = true; }
                        } else {
                            for (let i = 0; i < b.w; i++) occupied[b.c + i] = b;
                        }
                    });
                }
                if (corrected) { setTimeout(() => checkGravity(callback, isFinalCheck), 50); return; }
                checkLines(callback, isFinalCheck);
            }
        }

        function checkLines(callback, isFinalCheck = false) {
            let linesToClear = [];
            for (let r = 0; r < ROWS; r++) {
                let map = new Array(COLS).fill(0);
                blocks.filter(b => b.targetR === r).forEach(b => { for (let i = 0; i < b.w; i++) map[b.c + i] = 1; });
                if (map.every(v => v === 1)) linesToClear.push(r);
            }

            if (linesToClear.length > 0) {
                const linesCount = linesToClear.length;
                turnLinesCleared += linesCount;

                let roundPoints = 0;
                let blocksToRemove = [];

                linesToClear.forEach(r => {
                    const rowBlocks = blocks.filter(b => b.targetR === r);
                    rowBlocks.forEach(b => {
                        if (b.isFrozen) {
                            b.iceHp--;
                            if (b.iceHp <= 0) { b.isFrozen = false; b.iceHp = 0; }
                        } else {
                            if (b.hasChest) giveChestReward(b.x + (b.w * CELL_SIZE / 2), b.y);
                            createExplosion(b.x + b.w * CELL_SIZE / 2, b.y + CELL_SIZE / 2, b.color);
                            blocksToRemove.push(b);
                        }
                    });
                    roundPoints += 100;
                });

                if (blocksToRemove.length > 0) {
                    playExplosionSound();
                    blocks = blocks.filter(b => !blocksToRemove.includes(b));

                    const multiplier = Math.max(1, turnLinesCleared);
                    const totalPoints = roundPoints * multiplier;
                    score += totalPoints;
                    if (score > bestScore) bestScore = score;
                    createFloatingText(canvas.width / 2 + 40, (linesToClear[0] * CELL_SIZE), `★ ${totalPoints}`, "#3b82f6");

                    saveData();
                    updateUI(true);

                    setTimeout(() => checkGravity(callback, isFinalCheck), 250);
                } else {
                    if (callback) callback();
                }

            } else {
                if (blocks.some(b => b.targetR <= 0)) { gameOver(); return; }

                if (callback) {
                    callback();
                } else {
                    isProcessingTurn = false;
                    setTimeout(() => { if (!isProcessingTurn) comboDisplayEl.style.opacity = "0"; }, 1500);
                    checkAutoRefill();
                }
            }
        }

        // --- CORREÇÃO: Refill mantém até a linha 6 (índice 4 de baixo pra cima é 6 linhas ocupadas) ---
        let currentDangerState = '';
        function updateWarningUI() {
            const activeRowIndices = new Set(blocks.map(b => b.targetR));
            const maxRowIndex = blocks.length > 0 ? Math.min(...activeRowIndices) : ROWS;

            let newState = '';
            if (maxRowIndex <= 1 && maxRowIndex >= 0) newState = 'alert-red';
            else if (maxRowIndex <= 4 && maxRowIndex > 1) newState = 'alert-yellow';

            if (isProcessingTurn) {
                if (currentDangerState === 'alert-red') newState = 'alert-red';
                else if (currentDangerState === 'alert-yellow' && newState === '') newState = 'alert-yellow';
            }

            if (currentDangerState !== newState) {
                if (newState === 'alert-red' && musicaIniciada) {
                    somDanger.currentTime = 0;
                    somDanger.volume = masterVolume;
                    somDanger.play().catch(() => { });
                } else if (currentDangerState === 'alert-red' && newState !== 'alert-red') {
                    somDanger.pause();
                    somDanger.currentTime = 0;
                }
                currentDangerState = newState;
                dangerOverlay.className = `absolute inset-0 pointer-events-none transition-all duration-300 z-20 rounded-xl ${newState}`;
            }
        }

        function checkAutoRefill() {
            if (isRefilling || isProcessingTurn) return;
            const activeRowIndices = new Set(blocks.map(b => b.targetR));
            const maxRowIndex = blocks.length > 0 ? Math.min(...activeRowIndices) : ROWS;

            // Se o topo da pilha estiver abaixo da linha 6 (índices 7, 8, 9), sobe linhas
            if (maxRowIndex > 4 || blocks.length === 0) {
                const rowsToAdd = maxRowIndex - 4; // Quantas linhas subir para chegar na 6 (índice 4)
                if (rowsToAdd > 0) {
                    isRefilling = true; isProcessingTurn = true;
                    pushMultipleRows(rowsToAdd, () => {
                        isRefilling = false; isProcessingTurn = false;
                        setTimeout(() => { comboDisplayEl.style.opacity = "0"; }, 1500);
                        checkStuckState();
                    });
                }
            } else {
                checkStuckState();
            }
        }

        function checkStuckState() {
            if (isProcessingTurn || isRefilling || isGameOverSequence) return;
            let canMove = false;
            for (let b of blocks) {
                if (!b.isFrozen) {
                    const canLeft = b.c > 0 && !blocks.some(o => o.targetR === b.targetR && o.c + o.w === b.c);
                    const canRight = b.c + b.w < COLS && !blocks.some(o => o.targetR === b.targetR && o.c === b.c + b.w);
                    if (canLeft || canRight) { canMove = true; break; }
                }
            }
            toggleStuckUI(!canMove);
        }

        function toggleStuckUI(show) {
            isStuckMode = show;
            if (show) {
                choiceMessage.classList.remove('hidden');
                arrowPreview.classList.remove('hidden');
            } else {
                choiceMessage.classList.add('hidden');
                arrowPreview.classList.add('hidden');
            }
        }

        function pushMultipleRows(count, finalCallback) {
            if (count <= 0) { if (finalCallback) finalCallback(); return; }
            pushNextRow(() => { setTimeout(() => { pushMultipleRows(count - 1, finalCallback); }, 150); });
        }

        function updateWizardCharge(amt) {
            if (wizardShieldActive) return;
            wizardCharge = Math.min(WIZARD_MAX, wizardCharge + amt);
            if (wizardCharge >= WIZARD_MAX) { wizardCharge = 0; triggerWizardSpell(); }
            updateWizardUI();
        }

        function triggerWizardSpell() {
            const eligible = blocks.filter(b => !b.isFrozen && b.targetR < ROWS && b !== selectedBlock);
            if (eligible.length > 0) {
                const b = eligible[Math.floor(Math.random() * eligible.length)];
                b.isFrozen = true; b.iceHp = 2;
                showToast("O Feiticeiro lançou um feitiço!");
            }
            gameWrapperEl.classList.add('alert-freeze');
            setTimeout(() => gameWrapperEl.classList.remove('alert-freeze'), 1000);
            checkStuckState();
        }

        function updateWizardUI() {
            wizardBarEl.style.width = `${(wizardCharge / WIZARD_MAX) * 100}%`;
            wizardContainerEl.classList.toggle('shield-active', wizardShieldActive);
            wizardTimerEl.classList.toggle('hidden', !wizardShieldActive);
        }

        function gameOver() {
            if (isGameOverSequence) return;
            gameActive = false; isGameOverSequence = true;
            toggleStuckUI(false);
            somDanger.pause();
            somDanger.currentTime = 0;
            overlay.classList.remove('hidden'); overlay.style.opacity = '1';
            finalScoreEl.textContent = score; finalBestEl.textContent = bestScore;
            somGameOver.currentTime = 0; somGameOver.volume = masterVolume; somGameOver.play().catch(() => { });
        }

        function updateUI(anim = false) {
            scoreEl.textContent = score; bestEl.textContent = bestScore;
            if (turnLinesCleared >= 2) {
                if (comboHideTimer) clearTimeout(comboHideTimer);
                comboDisplayEl.style.top = `${(canvas.height / 2) - 80}px`;
                comboDisplayEl.style.left = `50%`;
                comboDisplayEl.style.transform = `translate(-50%, -50%)`;
                comboDisplayEl.innerHTML = `COMBO<br>x${turnLinesCleared}`;
                comboDisplayEl.style.opacity = "1";
                comboDisplayEl.classList.remove('combo-pulse');
                void comboDisplayEl.offsetWidth;
                comboDisplayEl.classList.add('combo-pulse');
            }
        }

        function saveData() {
            localStorage.setItem('dropdom_best', bestScore);
            localStorage.setItem('dropdom_inventory', JSON.stringify(inventory));
        }

        canvas.addEventListener('mousedown', handleStart); canvas.addEventListener('touchstart', e => { e.preventDefault(); handleStart(e.touches[0]); });
        window.addEventListener('mousemove', handleMove); window.addEventListener('touchmove', e => { e.preventDefault(); handleMove(e.touches[0]); });
        window.addEventListener('mouseup', handleEnd); window.addEventListener('touchend', handleEnd);

        function handleStart(e) {
            if (!gameActive || isProcessingTurn || isRefilling) return;
            const rect = canvas.getBoundingClientRect(); const x = e.clientX - rect.left, y = e.clientY - rect.top;

            const c = Math.floor(x / CELL_SIZE), r = Math.floor(y / CELL_SIZE);
            if (activeTool && activeTool !== 'glove') {
                handleTool(r, c);
                return;
            }
            const b = blocks.find(b => b.targetR === r && c >= b.c && c < b.c + b.w);
            if (b) {
                if (b.isFrozen && activeTool !== 'glove') {
                    showToast("Bloco Congelado!", "error");
                    playErrorSound();
                    return;
                }
                if (activeTool === 'glove' && !b.isFrozen) {
                    cancelTool();
                }
                comboDisplayEl.style.opacity = "0";
                selectedBlock = b;
                dragStartX = x;
                blockStartX = b.x;
                originalC = b.c;
                playMoveSound();
            } else if (activeTool === 'glove') {
                cancelTool();
            }
        }

        function handleMove(e) {
            if (!selectedBlock) return;
            const rect = canvas.getBoundingClientRect(); const x = e.clientX - rect.left;
            const diff = x - dragStartX; let newX = blockStartX + diff;
            const boardMaxX = (COLS - selectedBlock.w) * CELL_SIZE;
            let limitL = 0, limitR = boardMaxX;
            blocks.forEach(b => {
                if (b !== selectedBlock && b.targetR === selectedBlock.targetR) {
                    if (b.c < selectedBlock.c) limitL = Math.max(limitL, (b.c + b.w) * CELL_SIZE);
                    else limitR = Math.min(limitR, b.c * CELL_SIZE - selectedBlock.w * CELL_SIZE);
                }
            });
            selectedBlock.x = Math.max(limitL, Math.min(newX, limitR));
        }

        function handleEnd() {
            if (!selectedBlock) return;
            const idealC = Math.round(selectedBlock.x / CELL_SIZE);
            const collision = blocks.some(b => {
                if (b === selectedBlock || b.targetR !== selectedBlock.targetR) return false;
                return !(idealC + selectedBlock.w <= b.c || b.c + b.w <= idealC);
            });

            if (!collision && idealC !== selectedBlock.c) {
                if (selectedBlock.isFrozen && activeTool === 'glove') {
                    inventory['glove']--;
                    saveData();
                    cancelTool();
                }
                selectedBlock.c = idealC; selectedBlock.x = idealC * CELL_SIZE; selectedBlock = null;
                isProcessingTurn = true;
                toggleStuckUI(false);

                // NOVO: Reseta o contador de linhas destruídas no início do turno
                turnLinesCleared = 0;

                checkGravity(() => {
                    if (clockActive) {
                        isProcessingTurn = false;
                        if (turnLinesCleared === 0 && !isRefilling && !waitingForForceUp) {
                            updateWizardCharge(8);
                        }
                        setTimeout(() => { if (!isProcessingTurn) comboDisplayEl.style.opacity = "0"; }, 1500);
                    } else {
                        triggerPushChain(() => {
                            isProcessingTurn = false;

                            // Se nenhuma linha foi destruída em todo o processo, sobe mana
                            if (turnLinesCleared === 0 && !isRefilling && !waitingForForceUp) {
                                updateWizardCharge(8);
                            }

                            // Fade out do combo
                            setTimeout(() => { if (!isProcessingTurn) comboDisplayEl.style.opacity = "0"; }, 1500);
                            checkAutoRefill();
                        });
                    }
                }, false);
            } else {
                selectedBlock.x = selectedBlock.c * CELL_SIZE; selectedBlock = null;
            }
        }

        function loop() {
            if (gameActive) {
                updateWarningUI();
                // Estilo Original
                ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)'; ctx.lineWidth = 1;
                for (let i = 1; i < COLS; i++) { ctx.beginPath(); ctx.moveTo(i * CELL_SIZE, 0); ctx.lineTo(i * CELL_SIZE, canvas.height); ctx.stroke(); }
                for (let j = 1; j < ROWS; j++) { ctx.beginPath(); ctx.moveTo(0, j * CELL_SIZE); ctx.lineTo(canvas.width, j * CELL_SIZE); ctx.stroke(); }

                ctx.fillStyle = '#1e293b'; ctx.fillRect(0, ROWS * CELL_SIZE, canvas.width, CELL_SIZE + 5);
                ctx.strokeStyle = '#06b6d4'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, ROWS * CELL_SIZE); ctx.lineTo(canvas.width, ROWS * CELL_SIZE); ctx.stroke();

                if (selectedBlock) {
                    const idealC = Math.round(selectedBlock.x / CELL_SIZE);
                    ctx.save();
                    ctx.globalAlpha = 0.1;
                    const gap = 3, r = 8;
                    const origX = originalC * CELL_SIZE;
                    const origY = selectedBlock.targetR * CELL_SIZE;
                    ctx.fillStyle = selectedBlock.isGray ? '#475569' : selectedBlock.color;
                    ctx.shadowColor = selectedBlock.isGray ? 'transparent' : selectedBlock.color;
                    ctx.shadowBlur = selectedBlock.isGray ? 0 : 8;
                    selectedBlock.roundRect(origX + gap, origY + gap, (selectedBlock.w * CELL_SIZE) - gap * 2, CELL_SIZE - gap * 2, r);
                    ctx.fill();
                    if (!selectedBlock.isGray) {
                        ctx.fillStyle = `rgba(255,255,255,0.1)`;
                        ctx.fillRect(origX + gap + 4, origY + gap + 4, (selectedBlock.w * CELL_SIZE) - gap * 2 - 8, (CELL_SIZE - gap * 2) / 2 - 2);
                    }
                    if (selectedBlock.hasChest && !selectedBlock.isGray) {
                        if (emojiImages.chest && emojiImages.chest.complete) {
                            const size = 24;
                            ctx.drawImage(emojiImages.chest, origX + (selectedBlock.w * CELL_SIZE) / 2 - size / 2, origY + CELL_SIZE / 2 - size / 2, size, size);
                        } else {
                            ctx.shadowBlur = 10; ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.fillStyle = 'white'; ctx.font = '20px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🎁', origX + (selectedBlock.w * CELL_SIZE) / 2, origY + CELL_SIZE / 2);
                        }
                    }
                    if (selectedBlock.isFrozen && !selectedBlock.isGray) {
                        ctx.shadowBlur = 15; ctx.shadowColor = "#22d3ee"; ctx.fillStyle = 'rgba(165, 243, 252, 0.4)';
                        selectedBlock.roundRect(origX + gap, origY + gap, (selectedBlock.w * CELL_SIZE) - gap * 2, CELL_SIZE - gap * 2, r); ctx.fill();
                        ctx.shadowBlur = 0;

                        if (emojiImages.ice && emojiImages.ice.complete) {
                            const size = 20;
                            const totalW = size + 15;
                            const startX = origX + (selectedBlock.w * CELL_SIZE) / 2 - totalW / 2;
                            ctx.drawImage(emojiImages.ice, startX, origY + CELL_SIZE / 2 - size / 2, size, size);
                            ctx.fillStyle = 'white'; ctx.font = `bold 18px Rajdhani`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                            ctx.fillText(selectedBlock.iceHp, startX + size + 2, origY + CELL_SIZE / 2);
                        } else {
                            ctx.fillStyle = 'white'; ctx.font = `bold 18px Rajdhani`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                            ctx.fillText(`🧊${selectedBlock.iceHp}`, origX + (selectedBlock.w * CELL_SIZE) / 2, origY + CELL_SIZE / 2);
                        }
                    }
                    let dropR = selectedBlock.targetR;
                    while (dropR < ROWS - 1) {
                        const nextR = dropR + 1;
                        const hasCollision = blocks.some(b => { if (b === selectedBlock) return false; if (b.targetR !== nextR) return false; return !(idealC + selectedBlock.w <= b.c || b.c + b.w <= idealC); });
                        if (!hasCollision) dropR = nextR; else break;
                    }
                    ctx.globalAlpha = 0.3; ctx.fillStyle = selectedBlock.color; ctx.setLineDash([]);
                    ctx.fillRect(idealC * CELL_SIZE + 4, dropR * CELL_SIZE + 4, (selectedBlock.w * CELL_SIZE) - 8, CELL_SIZE - 8);
                    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.shadowColor = "#ffffff"; ctx.shadowBlur = 10;
                    ctx.strokeRect(idealC * CELL_SIZE + 4, dropR * CELL_SIZE + 4, (selectedBlock.w * CELL_SIZE) - 8, CELL_SIZE - 8);
                    ctx.restore();
                }
                blocks.forEach(b => b.draw());
                nextRowBlocks.forEach(b => { ctx.save(); ctx.globalAlpha = 0.4; const py = (ROWS * CELL_SIZE) + 5 - (b.targetR * CELL_SIZE); b.draw(py); ctx.restore(); });
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 4, 4);
                    if (p.life <= 0) particles.splice(i, 1);
                }
                ctx.globalAlpha = 1;
                animationFrameId = requestAnimationFrame(loop);
            }
        }

        restartBtn.addEventListener('click', () => location.reload());

        // Iniciar
        resizeCanvas();
        initGame(); // Inicia direto
    </script>
